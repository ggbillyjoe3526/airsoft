# TEMPORARY (DG1, PR #414): Woodland's bot balance on 32 seeds, run on GitHub's runners (long runs go on GitHub).
# Removed before the pull request merges.
name: DG1 balance (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/dg1-balance.yml

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  balance:
    name: DG1 balance, ${{ matrix.part.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: "Woodland PTB Normal 9 s", key: f9-plant-normal, level: normal, modes: plant, hard: "", ref: "" }
          - { name: "Woodland PTB Easy 9 s", key: f9-plant-easy, level: easy, modes: plant, hard: "", ref: "" }
          - { name: "Woodland PTB Hard 9 s", key: f9-plant-hard, level: hard, modes: plant, hard: "", ref: "" }
          - { name: "Woodland PTB Hard, Hard wait 12 s", key: h12-plant-hard, level: hard, modes: plant, hard: "12", ref: "" }
          - { name: "Woodland PTB Hard 8 s at Hard", key: h8-plant-hard, level: hard, modes: plant, hard: "8", ref: "" }
          - { name: "Woodland A/D Normal", key: f9-flag-normal, level: normal, modes: flag, hard: "", ref: "" }
          - { name: "Woodland Elimination Normal", key: f9-elim-normal, level: normal, modes: elimination, hard: "", ref: "" }
          - { name: "main, Woodland PTB Hard", key: main-plant-hard, level: hard, modes: plant, hard: "", ref: "main" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.part.ref }}

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: The Hard-only bomb wait (a candidate)
        if: matrix.part.hard != ''
        run: |
          sed -i 's/^| woodland | Woodland | field | public | 5 | 6 | 8 | 180 | 9 | 26 | 11 |  | 9 |  |/| woodland | Woodland | field | public | 5 | 6 | 8 | 180 | 9 | 26 | 11 |  | 9 | ${{ matrix.part.hard }} |/' data/maps.md
          grep '^| woodland' data/maps.md

      - name: Balance run (32 seeds)
        run: |
          godot --headless --path . --import > import.log 2>&1 || true
          mkdir -p out
          timeout 20000 godot --headless --path . -s res://tests/balance/balance_run.gd -- \
            "$PWD/out/${{ matrix.part.key }}.md" "$(git rev-parse --short HEAD)" 32 woodland ${{ matrix.part.level }} 32 \
            ${{ matrix.part.modes }} > out/run.log 2>&1 || true
          echo "===== REPORT ${{ matrix.part.key }} ====="
          cat "out/${{ matrix.part.key }}.md" || tail -40 out/run.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dg1-${{ matrix.part.key }}
          path: out/
          retention-days: 4
