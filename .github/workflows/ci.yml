name: Checks

# Every pull request and every push to main: lint the scripts, check the changelog notes and the wiki, run the GUT unit
# tests (in four parts side by side, CI1), import the project and run the headless smoke test, check the licence
# notices are current, and play the match guards (whole bot matches over 16 seeds, Elimination and Attack / Defend each a
# job of their own, the night guards six of their own, WL10, the callouts' guards one, CO1; pipeline/README.md › The
# checks). Fails on any script error or failed test. The Review line is checked by review.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main are grouped by commit so none is cancelled and
# every merge shows whether main is green.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.7.2" # must match project.godot (config/features) and release.yml
  GODOT_STATUS: "stable"

jobs:
  godot:
    name: Unit tests part 1, smoke test, notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Smoke test (imports the project, then runs it headless)
        run: tools/smoke_test.sh

      - name: Unit tests, part 1 (tests/unit/test_a* to test_dev*)
        if: success() || failure()
        run: tools/unit_tests.sh 1

      - name: Licence notices are up to date
        if: success() || failure()
        run: |
          godot --headless --path . -s res://tools/make_notices.gd
          if ! git diff --exit-code -- THIRD_PARTY_NOTICES.txt; then
            echo "::error::THIRD_PARTY_NOTICES.txt is out of date. Run: godot --headless --path . -s res://tools/make_notices.gd and commit the result."
            exit 1
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs
          path: |
            import.log
            smoke.log
            unit-1.log
          if-no-files-found: ignore
          retention-days: 14

  unit-2:
    name: Unit tests part 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Unit tests, part 2 (tests/unit/test_df* to test_fr*)
        run: tools/unit_tests.sh 2

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-2-logs
          path: |
            import.log
            unit-2.log
          if-no-files-found: ignore
          retention-days: 14

  unit-3:
    name: Unit tests part 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Unit tests, part 3 (tests/unit/test_g* to test_re*)
        run: tools/unit_tests.sh 3

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-3-logs
          path: |
            import.log
            unit-3.log
          if-no-files-found: ignore
          retention-days: 14

  unit-4:
    name: Unit tests part 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Unit tests, part 4 (tests/unit/test_rg* to test_z*)
        run: tools/unit_tests.sh 4

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-4-logs
          path: |
            import.log
            unit-4.log
          if-no-files-found: ignore
          retention-days: 14

  # The Elimination guards, tests/guards/test_match_guards.gd in four jobs (a test name's part picks each): the whole
  # file outgrew one job's 30 minutes once Depot became the indoor hall with doors (DR1, DO1).
  guards:
    name: Match guards (16 seeds a field), ${{ matrix.part.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: "Depot at Normal", test: on_every_seed, log: guards-1 }
          - { name: "Depot at Easy and Hard", test: at_easy_and_hard, log: guards-2 }
          - { name: "Follow me", test: follow_a_leader, log: guards-3 }
          - { name: "Bots run low on BBs", test: put_low_gets_a_magazine, log: guards-4 }
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Match guards (tests/guards/test_match_guards.gd, ${{ matrix.part.name }})
        run: tools/match_guards.sh test_match_guards ${{ matrix.part.test }}
        env:
          GUARDS_LOG: ${{ matrix.part.log }}.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.part.log }}-log
          path: ${{ matrix.part.log }}.log
          if-no-files-found: ignore
          retention-days: 14

  flag-guards:
    name: Match guards, Attack / Defend (16 seeds a field)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Match guards (tests/guards, Attack / Defend)
        run: tools/match_guards.sh test_flag_guards
        env:
          GUARDS_LOG: flag-guards.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flag-guards-log
          path: flag-guards.log
          if-no-files-found: ignore
          retention-days: 14

  # The callouts' guards (CO1): every field played with and without the callouts, every map's calls kept to the pace.
  callout-guards:
    name: Callout guards (every map)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Callout guards (tests/guards/test_callout_guards.gd)
        run: tools/match_guards.sh test_callout_guards
        env:
          GUARDS_LOG: callout-guards.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callout-guards-log
          path: callout-guards.log
          if-no-files-found: ignore
          retention-days: 14

  # The night guards: Woodland at 5v5, 50 to 70 s a match headless, tests/guards/test_woodland_guards.gd in five jobs
  # of 8 or 16 matches (a test name's part picks them).
  night-guards:
    name: Night match guards, ${{ matrix.part.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: "Woodland, Elimination at Normal", file: test_woodland_guards, test: elimination_at_normal, log: night-guards-1 }
          - { name: "Woodland, Elimination at Easy", file: test_woodland_guards, test: elimination_at_easy, log: night-guards-2 }
          - { name: "Woodland, Attack / Defend at Normal", file: test_woodland_guards, test: attack_defend_at_normal, log: night-guards-3 }
          - { name: "Woodland, Attack / Defend at Easy", file: test_woodland_guards, test: attack_defend_at_easy, log: night-guards-4 }
          - { name: "Woodland, both modes at Hard", file: test_woodland_guards, test: at_hard, log: night-guards-5 }
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Night match guards (tests/guards/${{ matrix.part.file }}.gd, ${{ matrix.part.name }})
        run: tools/match_guards.sh ${{ matrix.part.file }} ${{ matrix.part.test }}
        env:
          GUARDS_LOG: ${{ matrix.part.log }}.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.part.log }}-log
          path: ${{ matrix.part.log }}.log
          if-no-files-found: ignore
          retention-days: 14

  # The Street's guards (ST1): 5v5 by day at Normal and by night at Easy and Hard, tests/guards/test_street_guards.gd
  # in three jobs of 8 or 16 matches (a test name's part picks them).
  street-guards:
    name: Street match guards, ${{ matrix.part.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: "Elimination by day at Normal", test: elimination_at_normal, log: street-guards-1 }
          - { name: "Attack / Defend by day at Normal", test: attack_defend_at_normal, log: street-guards-2 }
          - { name: "both modes at night at Easy and Hard", test: at_night, log: street-guards-3 }
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}

      - name: Street match guards (tests/guards/test_street_guards.gd, ${{ matrix.part.name }})
        run: tools/match_guards.sh test_street_guards ${{ matrix.part.test }}
        env:
          GUARDS_LOG: ${{ matrix.part.log }}.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.part.log }}-log
          path: ${{ matrix.part.log }}.log
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint (gdlint, changelog notes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the changelog preview orders notes by when they were added

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: gdlint (settings in gdlintrc)
        run: gdlint game tests tools

      - name: Changelog notes (changelog.d/README.md)
        if: success() || failure()
        run: tools/changelog.sh check

      - name: Wiki (docs/wiki/README.md)
        if: success() || failure()
        env:
          BASE: ${{ github.base_ref }}
        run: python3 tools/wiki.py check ${BASE:+--base "origin/$BASE"}
